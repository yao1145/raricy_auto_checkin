name: RaricyCheckin
options:
  bundleIdPrefix: com.raricy
  deploymentTarget:
    iOS: "17.0"
targets:
  RaricyCheckin:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - RaricyCheckin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: "raricy 打卡"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
schemes:
  RaricyCheckin:
    build:
      targets:
        RaricyCheckin: all
    run:
      config: Debug
    archive:
      config: Release
