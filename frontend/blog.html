<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 博客工具 - raricy.com</title>
<style>
  :root {
    --bg: #0f1117;
    --card-bg: #1a1d27;
    --border: #2a2d3a;
    --text: #e1e4ed;
    --text-dim: #8b8fa3;
    --green: #2ecc71;
    --green-bg: rgba(46, 204, 113, 0.12);
    --red: #e74c3c;
    --red-bg: rgba(231, 76, 60, 0.12);
    --yellow: #f39c12;
    --yellow-bg: rgba(243, 156, 18, 0.12);
    --blue: #3498db;
    --blue-bg: rgba(52, 152, 219, 0.12);
    --radius: 10px;
    --transition: 0.2s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  .container { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }

  /* header */
  .header {
    text-align: center; margin-bottom: 28px;
  }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header .sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

  /* cards */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 13px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px;
  }

  /* grid layout */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

  @media (max-width: 640px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }

  /* status panel */
  .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .dot.on { background: var(--green); box-shadow: 0 0 8px rgba(46, 204, 113, 0.5); }
  .dot.off { background: var(--red); box-shadow: 0 0 8px rgba(231, 76, 60, 0.5); }
  .status-info { font-size: 13px; }
  .status-info span { color: var(--text-dim); }

  .stat-item { text-align: center; padding: 12px 8px; background: rgba(255,255,255,0.03); border-radius: 8px; }
  .stat-icon { font-size: 24px; margin-bottom: 4px; }
  .stat-value { font-size: 15px; font-weight: 600; }
  .stat-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .stat-time { font-size: 12px; color: var(--text-dim); }

  /* badges */
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 12px;
    font-size: 12px; font-weight: 600;
  }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-yellow { background: var(--yellow-bg); color: var(--yellow); }
  .badge-blue { background: var(--blue-bg); color: var(--blue); }

  /* buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 20px; border-radius: 8px; border: 1px solid transparent;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn-primary:hover:not(:disabled) { background: #2980b9; }
  .btn-success { background: var(--green); color: #fff; }
  .btn-success:hover:not(:disabled) { background: #27ae60; }
  .btn-danger { background: transparent; color: var(--red); border-color: var(--red); }
  .btn-danger:hover:not(:disabled) { background: var(--red-bg); }
  .btn-ghost {
    background: transparent; color: var(--text-dim); border-color: var(--border);
  }
  .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--text-dim); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-lg { padding: 16px 32px; font-size: 16px; border-radius: 12px; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

  /* forms */
  label {
    display: block; font-size: 12px; color: var(--text-dim);
    font-weight: 600; margin-bottom: 4px; text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  input, select {
    width: 100%; padding: 9px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 13px; font-family: inherit;
    transition: border-color var(--transition);
  }
  input:focus, select:focus { outline: none; border-color: var(--blue); }
  .form-group { margin-bottom: 12px; }
  .form-row { display: flex; gap: 10px; align-items: flex-end; }
  .form-row > * { flex: 1; }
  .form-hint { font-size: 11px; color: var(--text-dim); margin-top: 3px; }

  /* 博客文章表格 */
  .table-wrap { overflow: auto; max-height: 60vh; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th, td { padding: 10px 12px; text-align: left; }
  th { color: var(--text-dim); font-weight: 600; font-size: 15px; text-transform: uppercase; }
  /* 表头在 .table-wrap 内纵向滚动时固定于顶部 */
  thead th { position: sticky; top: 0; background: var(--card-bg); z-index: 1; }
  th[data-sort] { cursor: pointer; user-select: none; }
  th[data-sort]:hover { color: var(--text); }
  th.sorting-disabled { cursor: not-allowed; opacity: 0.45; pointer-events: none; }
  .sort-ind { font-size: 12px; color: var(--blue); margin-left: 2px; }
  /* 列宽固定，行高按内容自适应换行 */
  td { border-top: 1px solid var(--border); vertical-align: top; white-space: normal; overflow-wrap: break-word; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .empty-state { text-align: center; padding: 32px 0; color: var(--text-dim); font-size: 14px; }

  /* modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px; width: 100%; max-width: 540px;
    max-height: 85vh; overflow-y: auto;
  }
  .modal h2 { font-size: 17px; margin-bottom: 18px; }
  .modal-close {
    float: right; background: none; border: none; color: var(--text-dim);
    font-size: 22px; cursor: pointer; line-height: 1; padding: 0 4px;
  }
  .modal-close:hover { color: var(--text); }

  /* time tag */
  .time-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 20px; font-size: 13px; margin: 2px 4px;
  }
  .time-tag button {
    background: none; border: none; color: var(--red); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0 2px;
  }
  .time-tag button:hover { color: #c0392b; }

  /* toast */
  .toast {
    position: fixed; top: 20px; right: 20px; z-index: 200;
    padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 600;
    animation: slideIn 0.3s ease; max-width: 380px;
  }
  .toast-success { background: var(--green); color: #fff; }
  .toast-error { background: var(--red); color: #fff; }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* spinner */
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* sections */
  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }

  /* account list */
  .account-list { list-style: none; }
  .account-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px;
    background: rgba(255,255,255,0.02);
  }
  .account-item .acct-name { flex: 1; font-size: 13px; font-weight: 600; }
  .account-item .acct-status { font-size: 11px; }
  .account-checkbox { width: auto !important; cursor: pointer; }
  .account-select-row {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    margin-bottom: 12px; padding: 8px; background: rgba(255,255,255,0.02);
    border-radius: 8px;
  }
  .account-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 14px; font-size: 12px;
    border: 1px solid var(--border); cursor: pointer;
    transition: all var(--transition); user-select: none;
    background: var(--bg);
  }
  .account-chip.selected { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
  .account-chip .chip-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .account-chip .chip-dot.checked { background: var(--green); }
  .account-chip .chip-dot.unchecked { background: var(--red); }

  /* progress steps */
  .progress-steps { margin: 10px 0; }
  .progress-step {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    font-size: 12px; opacity: 0.35; transition: all 0.3s ease;
  }
  .progress-step.active { opacity: 1; }
  .progress-step.done { opacity: 0.8; }
  .progress-step .step-icon {
    width: 20px; height: 20px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 10px;
    flex-shrink: 0; border: 2px solid var(--border);
  }
  .progress-step.active .step-icon {
    border-color: var(--blue); background: var(--blue-bg);
    animation: pulse-step 1.2s ease-in-out infinite;
  }
  .progress-step.done .step-icon {
    border-color: var(--green); background: var(--green-bg);
  }
  .progress-step.error .step-icon {
    border-color: var(--red); background: var(--red-bg);
  }
  @keyframes pulse-step {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .progress-step .step-label { flex: 1; }
  .progress-step .step-time { font-size: 10px; color: var(--text-dim); }

  /* 前端风格进度条（深色主题） */
  .pbar-track {
    width: 100%;
    height: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin: 10px 0 4px;
  }
  .pbar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--green));
    border-radius: 6px;
    transition: width 0.3s ease;
  }
  .pbar-indeterminate {
    height: 100%;
    width: 40%;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--blue), var(--green));
    animation: pbar-slide 1.2s ease-in-out infinite;
  }
  @keyframes pbar-slide {
    0% { margin-left: -40%; }
    100% { margin-left: 100%; }
  }
  .pbar-label {
    font-size: 11px;
    color: var(--text-dim);
    text-align: right;
    margin-top: 2px;
  }
</style>
</head>
<body>
<div class="container">

  <!-- header -->
  <div class="header">
    <h1>📚 博客工具</h1>
    <div class="sub">raricy.com · 目录扫描 / 内容抓取 / 批量点赞</div>
  </div>

  <!-- 操作卡片 -->
  <div class="card">
    <div class="card-title">🎯 操作</div>

    <!-- 点赞账号选择 -->
    <div id="accountSelector" style="margin-bottom:8px;">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">选择点赞账号</div>
      <div id="accountChips" style="display:flex;flex-wrap:wrap;gap:6px;">
        <span style="font-size:12px;color:var(--text-dim);">加载中...</span>
      </div>
    </div>

    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-primary" id="scanBtn" onclick="scanDirectory()">🔄 扫描目录</button>
      <button class="btn btn-ghost" id="fetchBtn" onclick="fetchSelected()" disabled>⬇ 抓取内容</button>
      <button class="btn btn-success" id="likeBtn" onclick="likeSelected()" disabled>👍 点赞所选</button>
      <a class="btn btn-ghost" href="/" style="text-decoration:none;">↩ 返回打卡</a>
    </div>
    <div style="text-align:center;margin-top:8px;">
      <span id="selectedCount" style="font-size:11px;color:var(--text-dim);"></span>
    </div>
  </div>

  <!-- 任务进度 -->
  <div class="card" id="progressCard" style="display:none;">
    <div class="card-title">⏳ 任务进度</div>
    <div id="progress"></div>
  </div>

  <!-- 文章列表 -->
  <div class="card">
    <div class="section-header">
      <span class="card-title" style="margin-bottom:0;">📄 文章列表</span>
      <span style="font-size:12px;color:var(--text-dim);" id="articleCount"></span>
    </div>
    <div class="card" style="padding:12px 16px;">
      <div class="form-row" style="flex-wrap:wrap;align-items:flex-end;gap:10px;">
        <div class="form-group" style="flex:1;min-width:140px;">
          <label>作者</label>
          <select id="filterAuthor" onchange="applyFilters()"><option value="">全部</option></select>
        </div>
        <div class="form-group" style="flex:1;min-width:140px;">
          <label>分类</label>
          <select id="filterCategory" onchange="applyFilters()"><option value="">全部</option></select>
        </div>
        <div class="form-group" style="flex:1;min-width:120px;">
          <label>点赞 ≥</label>
          <input type="number" id="filterMinLikes" min="0" value="" onchange="applyFilters()">
        </div>
        <div class="form-group" style="flex:1;min-width:140px;">
          <label>内容状态</label>
          <select id="filterStatus" onchange="applyFilters()">
            <option value="">全部</option>
            <option value="fetched">已抓取</option>
            <option value="unfetched">未抓取</option>
          </select>
        </div>
      </div>
      <div class="btn-row" style="justify-content:flex-end;margin-top:12px;flex-wrap:wrap;gap:8px;">
        <button class="btn btn-danger" id="clearBtn" onclick="clearDb()">🗑 清空数据库</button>
      </div>
    </div>
    <div class="table-wrap">
      <table id="articlesTable">
        <thead>
          <tr>
            <th style="width:40px;"><input type="checkbox" id="checkAll" style="width:auto;cursor:pointer;" onchange="toggleAll()" title="全选 / 取消全选"></th>
            <th data-sort="title" onclick="setSort('title')" style="width:35%;">标题 <span class="sort-ind"></span></th>
            <th data-sort="author" onclick="setSort('author')" style="width:12%;">作者 <span class="sort-ind"></span></th>
            <th data-sort="category" onclick="setSort('category')" style="width:13%;">分类 <span class="sort-ind"></span></th>
            <th data-sort="likes_count" onclick="setSort('likes_count')" style="width:8%;">点赞 <span class="sort-ind"></span></th>
            <th data-sort="content_status" onclick="setSort('content_status')" style="width:15%;">内容状态 <span class="sort-ind"></span></th>
            <th data-sort="content_fetched_at" onclick="setSort('content_fetched_at')" style="width:17%;">更新时间 <span class="sort-ind"></span></th>
          </tr>
        </thead>
        <tbody id="articlesBody">
          <tr><td colspan="7" class="empty-state">加载中...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="pagination" style="display:flex;justify-content:center;align-items:center;gap:12px;margin-top:14px;"></div>
  </div>

  <!-- 查看内容弹窗 -->
  <div class="modal-overlay" id="contentModal">
    <div class="modal">
      <button class="modal-close" onclick="closeContentModal()">&times;</button>
      <h2 id="contentModalTitle">文章内容</h2>
      <div id="contentModalBody" style="white-space:pre-wrap;font-size:13px;line-height:1.7;max-height:60vh;overflow-y:auto;user-select:text;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;"></div>
      <div class="btn-row" style="justify-content:flex-end;margin-top:12px;">
        <button class="btn btn-ghost btn-sm" onclick="closeContentModal()">关闭</button>
      </div>
    </div>
  </div>

  <!-- 结果 -->
  <div class="card" id="resultCard" style="display:none;">
    <div class="card-title">📋 结果</div>
    <div id="result" style="font-size:13px;"></div>
  </div>

</div><!-- /container -->

<!-- Toast 容器 -->
<div id="toastContainer"></div>

<script>
// ── API 工具 ─────────────────────────────────────────────
const API = {
  async get(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  },
  async post(url, body) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  },
};

// ── Toast ─────────────────────────────────────────────────
function toast(msg, type = "success") {
  const el = document.createElement("div");
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById("toastContainer").appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ── 通用工具 ──────────────────────────────────────────────
function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// ── 点赞账号选择 ─────────────────────────────────────────
let allAccounts = [];        // 所有账号列表
let selectedAccount = "";    // 用于点赞的账号（单选，默认第一个启用账号）
let likeStats = {};   // { username: {used, available} }
let likeLimit = 100;  // 每日点赞上限（由 /api/blog/like-stats 返回）

async function loadAccounts() {
  try {
    allAccounts = await API.get("/api/accounts");
    if (!selectedAccount) {
      const firstEnabled = allAccounts.find(a => a.enabled !== false);
      selectedAccount = (firstEnabled || allAccounts[0])?.username || "";
    }
  } catch (e) {
    allAccounts = [];
    toast("加载账号失败: " + e.message, "error");
  }
  renderAccountChips();
}

async function loadLikeStats() {
  try {
    const data = await API.get("/api/blog/like-stats");
    likeLimit = data.limit || 100;
    likeStats = data.accounts || {};
  } catch (e) {
    likeStats = {};
  }
  renderAccountChips();
  updateActionButtons();
}

function renderAccountChips() {
  const container = document.getElementById("accountChips");
  if (allAccounts.length === 0) {
    container.innerHTML = '<span style="font-size:12px;color:var(--text-dim);">暂无账号，请先在打卡页「⚙ 配置」中添加</span>';
    return;
  }
  container.innerHTML = allAccounts.map(a => {
    const sel = a.username === selectedAccount ? " selected" : "";
    const st = likeStats[a.username] || {};
    const used = st.used || 0;
    const available = (st.available != null) ? st.available : likeLimit;
    const badge = available <= 0
      ? `<span style="color:var(--red);">${used}/${likeLimit}</span>`
      : `<span style="color:var(--text-dim);">${used}/${likeLimit}</span>`;
    // 用 data-username 携带数据，由委托监听器处理（避免内联 onclick 的引号注入/XSS）
    return `<span class="account-chip${sel}" data-username="${escapeHtml(a.username)}" title="今日已点赞 ${used}/${likeLimit}（剩余 ${available} 次）">
      ${escapeHtml(a.username)} ${badge}
    </span>`;
  }).join("");
}

function selectAccount(username) {
  selectedAccount = username;
  renderAccountChips();
}

// ── 文章列表 ─────────────────────────────────────────────
let selectedIds = new Set();  // 勾选的文章 id
let _viewBtnListenerAttached = false;  // 「查看」委托监听器只挂载一次

// ── 筛选 / 排序 / 分页状态 ───────────────────────────────
let filters = { author: "", category: "", minLikes: null, status: "" };
let sortState = { key: null, dir: "asc" };
let articles = [];       // 一次加载全部文章，客户端分页
let likes = [];          // 全部点赞记录
let totalArticles = 0;
let currentPage = 1;     // 当前页码（1 起）
const PAGE_SIZE = 50;    // 每页条数
let loading = false;     // 正在加载全部文章

function buildQuery() {
  const p = new URLSearchParams();
  if (filters.author) p.set("author", filters.author);
  if (filters.category) p.set("category", filters.category);
  if (filters.minLikes != null && filters.minLikes !== "") p.set("min_likes", filters.minLikes);
  if (filters.status) p.set("status", filters.status);
  if (sortState.key) { p.set("sort", sortState.key); p.set("order", sortState.dir); }
  return p.toString();
}

async function loadArticles() {
  if (loading) return;
  loading = true;
  try {
    const data = await API.get(`/api/blog/articles/all?${buildQuery()}`);
    articles = data.articles;
    likes = data.likes;
    totalArticles = data.total;
    selectedIds.clear();  // 行集合整体替换，旧勾选失效
    currentPage = 1;      // 回到第一页
    renderArticlesTable();
  } catch (e) {
    toast("加载文章失败: " + e.message, "error");
    articles = [];
    likes = [];
    totalArticles = 0;
    document.getElementById("articleCount").textContent = "共 0 篇";
    document.getElementById("articlesBody").innerHTML =
      `<tr><td colspan="7" class="empty-state" style="color:var(--red);">加载失败: ${escapeHtml(e.message)}</td></tr>`;
    renderPagination();
    updateActionButtons();
    updateSortIndicators();
  } finally {
    loading = false;
  }
}

function applyFilters() {
  filters = {
    author: document.getElementById("filterAuthor").value,
    category: document.getElementById("filterCategory").value,
    minLikes: document.getElementById("filterMinLikes").value,
    status: document.getElementById("filterStatus").value,
  };
  loadArticles();
}

function setSort(key) {
  if (loading) return;  // 加载期间忽略排序点击
  if (sortState.key === key) {
    sortState.dir = sortState.dir === "asc" ? "desc" : sortState.dir === "desc" ? null : "asc";
    if (sortState.dir === null) sortState.key = null;
  } else {
    sortState.key = key;
    sortState.dir = "asc";
  }
  updateSortIndicators();
  loadArticles();
}

function updateSortIndicators() {
  document.querySelectorAll("th[data-sort]").forEach(th => {
    const ind = th.querySelector(".sort-ind");
    if (!ind) return;
    if (sortState.key === th.getAttribute("data-sort")) {
      ind.textContent = sortState.dir === "asc" ? "▲" : sortState.dir === "desc" ? "▼" : "";
    } else {
      ind.textContent = "";
    }
  });
}

async function loadMeta() {
  try {
    const data = await API.get("/api/blog/meta");
    const authorSel = document.getElementById("filterAuthor");
    const catSel = document.getElementById("filterCategory");
    authorSel.innerHTML = '<option value="">全部</option>' + (data.authors || []).map(a =>
      `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join("");
    catSel.innerHTML = '<option value="">全部</option>' + (data.categories || []).map(c =>
      `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  } catch (e) {
    toast("加载筛选选项失败: " + e.message, "error");
  }
}

function renderArticlesTable() {
  const tbody = document.getElementById("articlesBody");
  document.getElementById("articleCount").textContent = `共 ${totalArticles} 篇`;

  if (articles.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">暂无文章，请先扫描目录</td></tr>';
    renderPagination();
    updateActionButtons();
    updateSortIndicators();
    return;
  }

  // 客户端分页：一次加载全部后，按每页 50 条切片显示
  const totalPages = Math.max(1, Math.ceil(articles.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageArticles = articles.slice(start, start + PAGE_SIZE);

  // 按文章分组本地点赞记录
  const likesByArticle = {};
  likes.forEach(l => {
    if (!likesByArticle[l.article_id]) likesByArticle[l.article_id] = [];
    likesByArticle[l.article_id].push(l);
  });

  tbody.innerHTML = pageArticles.map(a => {
    const id = a.id;
    // list 接口不再返回 content（精简 payload），状态仅以抓取时间戳为准
    const contentFetched = !!a.content_fetched_at;
    const contentBadge = contentFetched
      ? '<span class="badge badge-green">已抓取</span>'
      : '<span class="badge" style="background:rgba(255,255,255,0.06);color:var(--text-dim);">未抓取</span>';

    // 内容状态列：已抓取 → 徽章 + 查看按钮；未抓取 → 仅徽章
    // 查看按钮用 data-* 属性携带数据，由委托监听器处理（避免内联 onclick 的引号注入/XSS）
    const statusCell = contentFetched
      ? contentBadge + ` <button class="btn btn-ghost btn-sm view-btn" data-id="${escapeHtml(id)}" data-title="${escapeHtml(a.title)}">查看</button>`
      : contentBadge;

    // 点赞列：本地点赞成功数（tooltip 保留完整历史，不再显示站点自身点赞数）
    const likeHistory = likesByArticle[id] || [];
    const successLikes = likeHistory.filter(l => l.success).length;
    const likeCell = successLikes > 0
      ? `<span title="${escapeHtml(likeHistory.map(l => `${l.success ? "✅" : "❌"} ${l.account} ${l.liked_at || ""}`).join("\n"))}" style="cursor:help;">${successLikes}</span>`
      : "0";

    const updated = a.content_fetched_at || a.created_at || "";
    const checked = selectedIds.has(id) ? " checked" : "";

    return `<tr>
      <td><input type="checkbox" class="row-check" style="width:auto;cursor:pointer;" value="${escapeHtml(id)}"${checked} onchange="toggleRow(this)"></td>
      <td><a href="${escapeHtml(a.url)}" target="_blank" rel="noopener" title="${escapeHtml(a.title)}" style="color:var(--text);text-decoration:none;"><b>${escapeHtml(a.title || "-")}</b></a></td>
      <td>${escapeHtml(a.author || "-")}</td>
      <td>${a.category ? `<span class="badge badge-blue">${escapeHtml(a.category)}</span>` : "-"}</td>
      <td>${likeCell}</td>
      <td>${statusCell}</td>
      <td style="font-size:11px;color:var(--text-dim);">${escapeHtml(updated)}</td>
    </tr>`;
  }).join("");

  renderPagination();
  updateActionButtons();
  updateSortIndicators();

  // 委托处理「查看」按钮（避免内联 onclick 的引号注入/XSS），只挂载一次
  if (!_viewBtnListenerAttached) {
    _viewBtnListenerAttached = true;
    tbody.addEventListener("click", function(e) {
      const btn = e.target.closest(".view-btn");
      if (!btn) return;
      const id = btn.getAttribute("data-id");
      const title = btn.getAttribute("data-title") || "";
      viewContent(id, title);
    });
  }
}

// ── 分页控件 ─────────────────────────────────────────────
function renderPagination() {
  const el = document.getElementById("pagination");
  if (!el) return;
  const totalPages = Math.max(1, Math.ceil(articles.length / PAGE_SIZE));
  if (totalPages <= 1) {
    el.innerHTML = "";
    return;
  }
  el.innerHTML = `
    <button class="btn btn-ghost btn-sm" onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>◀ 上一页</button>
    <span style="font-size:12px;color:var(--text-dim);">第 ${currentPage} / ${totalPages} 页（共 ${articles.length} 篇）</span>
    <button class="btn btn-ghost btn-sm" onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>下一页 ▶</button>
  `;
}

function goPage(page) {
  const totalPages = Math.max(1, Math.ceil(articles.length / PAGE_SIZE));
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderArticlesTable();
}

// ── 勾选状态 ──────────────────────────────────────────────
function toggleRow(cb) {
  if (cb.checked) selectedIds.add(cb.value);
  else selectedIds.delete(cb.value);
  updateActionButtons();
}

function toggleAll() {
  const all = document.getElementById("checkAll").checked;
  if (all) {
    articles.forEach(a => selectedIds.add(a.id));  // 全选（含未显示在当页的文章）
  } else {
    selectedIds.clear();
  }
  renderArticlesTable();  // 重绘当前页以同步复选框
}

function getSelectedIds() {
  return [...selectedIds];
}

// ── 查看内容弹窗 ─────────────────────────────────────────
async function viewContent(id, title) {
  document.getElementById("contentModalTitle").textContent = title || "文章内容";
  const body = document.getElementById("contentModalBody");
  body.textContent = "加载中...";
  document.getElementById("contentModal").classList.add("open");
  try {
    const article = await API.get(`/api/blog/article/${encodeURIComponent(id)}`);
    body.textContent = article.content || "(无内容)";
  } catch (e) {
    body.textContent = "";
    toast("加载内容失败: " + e.message, "error");
    closeContentModal();
  }
}

function closeContentModal() {
  document.getElementById("contentModal").classList.remove("open");
}

// 点击遮罩关闭
document.getElementById("contentModal").addEventListener("click", function(e) {
  if (e.target === this) closeContentModal();
});

// 委托处理账号 chip 选择（避免内联 onclick 的引号注入/XSS）
document.getElementById("accountChips").addEventListener("click", function(e) {
  const chip = e.target.closest(".account-chip");
  if (!chip) return;
  selectAccount(chip.getAttribute("data-username"));
});

// ── 操作按钮状态 ─────────────────────────────────────────
let _running = false;
const BTN_LABELS = { scan: "🔄 扫描目录", fetch: "⬇ 抓取内容", like: "👍 点赞所选" };

function updateActionButtons() {
  const busy = _running || loading;
  const count = selectedIds.size;
  const sel = likeStats[selectedAccount];
  const noQuota = !!(sel && sel.available <= 0);
  document.getElementById("scanBtn").disabled = busy;
  document.getElementById("fetchBtn").disabled = busy || count === 0;
  document.getElementById("likeBtn").disabled = busy || count === 0 || noQuota;

  const all = document.getElementById("checkAll");
  if (all) {
    const total = articles.length;
    all.checked = total > 0 && count === total;
    all.indeterminate = count > 0 && count < total;
  }

  const countEl = document.getElementById("selectedCount");
  if (countEl) countEl.textContent = count > 0 ? `已选 ${count} 篇` : "";
}

// ── 任务进度 ─────────────────────────────────────────────
let _pollTimer = null;

const POLL_MAX_MS = 600000; // 10 分钟：进度轮询最长时间，防止任务挂死时无限轮询

// 终止进度轮询并恢复按钮状态
function stopPoll(which, errorMsg) {
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
  _endTask(which);
  if (errorMsg) toast(errorMsg, "error");
}

function renderProgressSteps(steps) {
  // 博客任务步骤 → 显示文案（与打卡页风格一致）
  const STEP_LABELS = {
    "scan": "扫描目录",
    "scan_error": "扫描出错",
    "fetch": "抓取内容",
    "like": "批量点赞",
    "done": "完成",
    "error": "出错",
  };

  let html = '<div class="progress-steps">';

  if (steps && steps.length > 0) {
    // 按 step 去重（保留最后一次的 message/time），避免重复的 scan 步骤刷屏
    const seen = {};
    const unique = [];
    steps.forEach(s => {
      if (seen[s.step]) {
        seen[s.step].message = s.message;
        seen[s.step].time = s.time;
      } else {
        const copy = { ...s };
        seen[s.step] = copy;
        unique.push(copy);
      }
    });

    const lastStepKey = unique[unique.length - 1]?.step;
    unique.forEach(s => {
      let cls = "done";
      if (s.step === "error" || s.step === "scan_error") {
        cls = "error";
      } else if (s.step === lastStepKey && s.step !== "done") {
        cls = "active";
      }
      const label = STEP_LABELS[s.step] || s.message || s.step;
      const icon = cls === "done" ? "✓" : cls === "error" ? "✗" : cls === "active" ? "●" : "○";
      html += `<div class="progress-step ${cls}">
        <span class="step-icon">${icon}</span>
        <span class="step-label">${label}</span>
        <span class="step-time">${s.time || ''}</span>
      </div>`;
    });
  } else {
    html += `<div class="progress-step active">
      <span class="step-icon">●</span>
      <span class="step-label">正在准备...</span>
    </div>`;
  }

  html += '</div>';
  return html;
}

// 前端风格进度条：done=已处理数，total=总数（扫描未知总数时显示滑动不确定条）
function renderProgressBar(done, total) {
  if (done == null) return "";
  let fill = "", label = "";
  if (total) {
    const pct = Math.min(100, Math.round((done / total) * 100));
    fill = `<div class="pbar-fill" style="width:${pct}%;"></div>`;
    label = `${done} / ${total} · ${pct}%`;
  } else {
    fill = `<div class="pbar-indeterminate"></div>`;
    label = `已处理 ${done} 篇`;
  }
  return `<div class="pbar-track">${fill}</div><div class="pbar-label">${label}</div>`;
}

function pollProgress(which, task_id, onDone) {
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
  const progressCard = document.getElementById("progressCard");
  const progressDiv = document.getElementById("progress");
  progressCard.style.display = "";
  progressDiv.innerHTML = renderProgressSteps([]);

  const started = Date.now();
  _pollTimer = setInterval(async () => {
    try {
      if (Date.now() - started > POLL_MAX_MS) {
        stopPoll(which, "任务超时，已停止轮询");
        return;
      }
      const p = await API.get(`/api/blog/progress/${task_id}`);
      const bar = renderProgressBar(p.done_count, p.total_count);
      progressDiv.innerHTML = renderProgressSteps(p.steps || []) + bar;
      if (p.done) {
        clearInterval(_pollTimer);
        _pollTimer = null;
        onDone(p.results || {});
      }
    } catch (e) {
      // 404 / 连接失败：任务可能已失效，终止轮询而非无限重试
      stopPoll(which, "任务已失效或服务不可用，已停止轮询");
    }
  }, 500);
}

// ── 任务启动/结束（按钮状态）─────────────────────────────
function _startTask(which) {
  _running = true;
  document.getElementById("scanBtn").disabled = true;
  document.getElementById("fetchBtn").disabled = true;
  document.getElementById("likeBtn").disabled = true;
  document.getElementById(`${which}Btn`).innerHTML = '<span class="spinner"></span> 处理中...';
  document.getElementById("resultCard").style.display = "none";
}

function _endTask(which) {
  _running = false;
  document.getElementById(`${which}Btn`).innerHTML = BTN_LABELS[which];
  updateActionButtons();
}

// ── 结果展示 ─────────────────────────────────────────────
function renderSummary(results) {
  if (!results) return "";
  if (results.error) {
    return `<div style="color:var(--red);">❌ ${escapeHtml(results.error)}</div>`;
  }
  if ("success" in results) {
    const skip = results.skipped ? `，跳过 <b>${results.skipped}</b>` : "";
    const limited = results.limited ? `，超出额度 <b>${results.limited}</b>` : "";
    const avail = (results.available != null)
      ? `，今日剩余 <b style="color:var(--blue);">${results.available}</b>/${results.limit || 100}`
      : "";
    return `<div style="margin:3px 0;">✅ 成功 <b style="color:var(--green);">${results.success}</b> / 共 ${results.total} 篇，失败 <b style="color:var(--red);">${results.failed}</b>${skip}${limited}${avail}</div>`;
  }
  if ("new" in results) {
    return `<div style="margin:3px 0;">🆕 新增 <b style="color:var(--green);">${results.new}</b> 篇，共 <b>${results.total}</b> 篇，错误 <b style="color:var(--red);">${results.errors}</b></div>`;
  }
  return `<div style="margin:3px 0;">${escapeHtml(JSON.stringify(results))}</div>`;
}

function showResult(results) {
  const card = document.getElementById("resultCard");
  const div = document.getElementById("result");
  card.style.display = "";
  div.innerHTML = renderSummary(results);
}

// ── 动作：扫描目录 ───────────────────────────────────────
async function scanDirectory() {
  _startTask("scan");
  try {
    const { task_id } = await API.post("/api/blog/scan", {});
    pollProgress("scan", task_id, (results) => {
      _endTask("scan");
      showResult(results);
      if (results.error) {
        toast("扫描失败: " + results.error, "error");
      } else {
        toast(`扫描完成: 共 ${results.total} 篇，新增 ${results.new} 篇`);
        loadArticles();
      }
    });
  } catch (e) {
    _endTask("scan");
    showResult({ error: e.message });
    toast("请求失败: " + e.message, "error");
  }
}

// ── 动作：抓取内容 ───────────────────────────────────────
async function fetchSelected() {
  const ids = getSelectedIds();
  if (ids.length === 0) {
    toast("请先勾选要抓取的文章", "error");
    return;
  }
  _startTask("fetch");
  try {
    const { task_id } = await API.post("/api/blog/fetch", { article_ids: ids });
    pollProgress("fetch", task_id, (results) => {
      _endTask("fetch");
      showResult(results);
      if (results.error) {
        toast("抓取失败: " + results.error, "error");
      } else {
        toast(`抓取完成: 成功 ${results.success} / 失败 ${results.failed}`);
        loadArticles();
      }
    });
  } catch (e) {
    _endTask("fetch");
    showResult({ error: e.message });
    toast("请求失败: " + e.message, "error");
  }
}

// ── 动作：点赞所选 ───────────────────────────────────────
async function likeSelected() {
  const ids = getSelectedIds();
  if (ids.length === 0) {
    toast("请先勾选要点赞的文章", "error");
    return;
  }
  if (!selectedAccount) {
    toast("请先选择点赞账号", "error");
    return;
  }
  const st = likeStats[selectedAccount];
  if (st && st.available <= 0) {
    toast(`${selectedAccount} 今日点赞次数已用完（${st.used}/${likeLimit}）`, "error");
    return;
  }
  _startTask("like");
  try {
    const { task_id } = await API.post("/api/blog/like", {
      article_ids: ids,
      account: selectedAccount,
    });
    pollProgress("like", task_id, (results) => {
      _endTask("like");
      showResult(results);
      if (results.error) {
        toast("点赞失败: " + results.error, "error");
      } else {
        toast(`点赞完成: 成功 ${results.success} / 失败 ${results.failed}`);
        loadLikeStats();
        loadArticles();
      }
    });
  } catch (e) {
    _endTask("like");
    showResult({ error: e.message });
    toast("请求失败: " + e.message, "error");
  }
}

// ── 动作：清空数据库 ─────────────────────────────────────
async function clearDb() {
  if (_running || loading) { toast("请先等待当前任务完成", "error"); return; }
  if (!confirm("确定清空所有文章与点赞记录？此操作不可恢复。")) return;
  try {
    await API.post("/api/blog/clear", {});
    toast("数据库已清空");
    articles = []; likes = []; totalArticles = 0;
    selectedIds.clear();  // 清空后不再有可操作的行
    currentPage = 1;
    renderArticlesTable();
  } catch (e) {
    toast("清空失败: " + e.message, "error");
  }
}

// ── 初始化 ───────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  loadAccounts();
  loadLikeStats();
  loadMeta();
  loadArticles();
  // 每 10 分钟自动刷新文章列表（任务进行中跳过，避免覆盖进度）
  setInterval(() => {
    if (_running || loading) return;
    loadArticles();
  }, 600000);
});
</script>
