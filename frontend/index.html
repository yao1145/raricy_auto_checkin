<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>控制中心 · raricy.com</title>
<link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/ico" href="favicon.ico">
</head>
<body>
<canvas id="space-bg" aria-hidden="true"></canvas>
<div class="nebula nebula-a"></div>
<div class="nebula nebula-b"></div>
<div class="nebula nebula-c"></div>

<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark"></span>
    <span class="brand-name">RARICY<span class="brand-sub">AUTO CHECK-IN</span></span>
  </a>
  <nav class="nav">
    <a href="/" data-nav="index">控制中心</a>
    <a href="/checkin" data-nav="checkin">自动打卡</a>
    <a href="/blog" data-nav="blog">博客工具</a>
    <a href="/config" data-nav="config">系统配置</a>
  </nav>
</header>

<div class="container">
  <header class="page-head">
    <h1 class="page-title">控制<span class="accent">中心</span></h1>
    <p class="page-sub">RARICY.COM 自动化操作台</p>
  </header>

  <!-- 今日状态 -->
  <section class="card">
    <div class="card-title">今日状态</div>
    <div id="statusContent"><span class="spinner"></span> 加载中...</div>
  </section>

  <!-- 功能导航 -->
  <section class="card">
    <div class="card-title">功能导航</div>
    <div class="tool-grid">
      <a class="tool-card" href="/checkin">
        <div class="tool-glyph">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M8 12l2.5 2.5L16 9"></path>
          </svg>
        </div>
        <div class="tool-name">自动打卡</div>
        <div class="tool-desc">每日签到、批量打卡与定时任务，实时进度与日志记录</div>
        <span class="tool-cta">进入模块 →</span>
      </a>
      <a class="tool-card" href="/blog">
        <div class="tool-glyph">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <path d="M14 2v6h6"></path>
            <path d="M9 13h6"></path>
            <path d="M9 17h6"></path>
          </svg>
        </div>
        <div class="tool-name">博客工具</div>
        <div class="tool-desc">博客目录扫描、内容抓取与批量点赞，支持筛选排序</div>
        <span class="tool-cta">进入模块 →</span>
      </a>
      <a class="tool-card" href="/config">
        <div class="tool-glyph">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 21v-7"></path>
            <path d="M4 10V3"></path>
            <path d="M12 21v-9"></path>
            <path d="M12 8V3"></path>
            <path d="M20 21v-5"></path>
            <path d="M20 12V3"></path>
            <path d="M1 14h6"></path>
            <path d="M9 8h6"></path>
            <path d="M17 16h6"></path>
          </svg>
        </div>
        <div class="tool-name">系统配置</div>
        <div class="tool-desc">账号、站点、API 路径与定时任务集中管理</div>
        <span class="tool-cta">进入模块 →</span>
      </a>
    </div>
  </section>
</div>

<script src="app.js"></script>
<script src="bg.js"></script>
<script>
// 控制中心：今日状态快照
async function refreshStatus() {
  const box = document.getElementById("statusContent");
  try {
    const data = await API.get("/api/status");

    const todayBadge = data.today_checked
      ? '<span class="badge badge-green">已打卡</span>'
      : '<span class="badge badge-red">未打卡</span>';

    const nextRun = data.next_scheduled
      ? escapeHtml(data.next_scheduled)
      : '<span class="badge badge-muted">暂无定时任务</span>';

    const schedDot = data.schedule_enabled
      ? '<span class="dot on"></span>'
      : '<span class="dot off"></span>';
    const schedText = data.schedule_enabled ? '定时已开启' : '定时已关闭';

    box.innerHTML =
      '<div class="status-row">' +
        '<span class="status-info"><span>今日打卡</span></span>' + todayBadge +
      '</div>' +
      '<div class="status-row">' +
        '<span class="status-info"><span>下次定时</span></span>' +
        '<span>' + nextRun + '</span>' +
      '</div>' +
      '<div class="status-row">' +
        '<span class="status-info"><span>调度器</span></span>' +
        schedDot +
        '<span>' + schedText + '</span>' +
      '</div>';
  } catch (e) {
    box.innerHTML =
      '<div class="empty-state" style="color:var(--red);">状态加载失败: ' +
      escapeHtml(e.message) + '</div>';
  }
}

refreshStatus();
setInterval(refreshStatus, 600000);
</script>
</body>
</html>
