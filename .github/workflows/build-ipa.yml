name: Build iOS IPA

# 在 GitHub macOS runner 上构建未签名 IPA（无需 Mac、无需开发者账号）。
# 产物 ios/RaricyCheckin.ipa 交给 AltStore/SideStore 用个人 Apple ID 重签名安装。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project RaricyCheckin.xcodeproj \
            -scheme RaricyCheckin \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RaricyCheckin.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -R "build/RaricyCheckin.xcarchive/Products/Applications/RaricyCheckin.app" build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload ../RaricyCheckin.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaricyCheckin-ipa
          path: ios/RaricyCheckin.ipa
